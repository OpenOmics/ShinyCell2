name: PR Installation Gate

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  install-test:
    runs-on: ubuntu-latest
    container:
      image: rroutsong/shinycell2_builder:latest
      options: --user root  # Run as root to avoid permission issues
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify checkout and display file structure
        run: |
          echo "📂 Current working directory:"
          pwd
          echo ""
          echo "📋 Repository files:"
          ls -la
          echo ""
          echo "✅ DESCRIPTION file exists:"
          if [ -f "DESCRIPTION" ]; then
            cat DESCRIPTION | head -10
          else
            echo "❌ ERROR: DESCRIPTION file not found!"
            exit 1
          fi
      
      - name: Display R version
        run: Rscript -e "cat('R version:', R.version.string, '\n')"
      
      - name: Uninstall existing ShinyCell2
        run: |
          Rscript -e "if ('ShinyCell2' %in% installed.packages()[,'Package']) { remove.packages('ShinyCell2'); cat('✅ Removed existing ShinyCell2\n') } else { cat('ℹ️  No existing ShinyCell2 to remove\n') }"
      
      - name: Install ShinyCell2 from PR branch
        run: |
          echo "📦 Installing ShinyCell2 from: $(pwd)"
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'
          
      - name: Test package loading
        run: |
          Rscript -e "library(ShinyCell2)" || { echo "❌ Failed to load ShinyCell2 package"; exit 1; }
          echo "✅ ShinyCell2 package loaded successfully"
      
      - name: Display package version
        run: Rscript -e "cat('ShinyCell2 version:', as.character(packageVersion('ShinyCell2')), '\n')"
      
      - name: Test basic functions
        run: |
          Rscript -e "
          library(ShinyCell2)
          # Test that writer functions exist
          if (!exists('wrShFunc')) stop('wrShFunc function not found')
          if (!exists('wrSVmainA1')) stop('wrSVmainA1 function not found')
          if (!exists('wrSVmainD1')) stop('wrSVmainD1 function not found')
          cat('✅ All basic functions exist\n')
          "
