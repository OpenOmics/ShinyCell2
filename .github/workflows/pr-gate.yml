name: PR Installation Gate

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  install-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      
      - name: Display R version
        run: Rscript -e "cat('R version:', R.version.string, '\n')"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libhdf5-dev

      - name: Install pak package
        run: |
          Rscript -e "install.packages('pak')"
          Rscript -e 'pak::pak(c("shiny", "shinyhelper", "Matrix", "DT", "magrittr", 
           "ggplot2", "ggrepel", "hdf5r", "ggdendro", "ggpubr", 
           "data.table", "Matrix", "reticulate", "R.utils", 
           "gridExtra", "glue", "readr", "future", "RColorBrewer"))'

      - name: Install ShinyCell2 package
        run: |
          # Rscript -e 'install.packages(".", repos = NULL, type = "source")'
          pak::local_install(".")
          
      - name: Test package loading
        run: |
          Rscript -e "library(ShinyCell2)" || { echo "❌ Failed to load ShinyCell2 package"; exit 1; }
          echo "✅ ShinyCell2 package loaded successfully"
      
      - name: Display package version
        run: Rscript -e "cat('ShinyCell2 version:', as.character(packageVersion('ShinyCell2')), '\n')"
      
      - name: Test basic functions
        run: |
          Rscript -e "
          library(ShinyCell2)
          # Test that writer functions exist
          if (!exists('wrShFunc')) stop('wrShFunc function not found')
          if (!exists('wrSVmainA1')) stop('wrSVmainA1 function not found')
          if (!exists('wrSVmainD1')) stop('wrSVmainD1 function not found')
          cat('✅ All basic functions exist\n')
          "
